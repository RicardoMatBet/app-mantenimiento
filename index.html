<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<title>Control de Mantenimiento</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--dark:#1a2332;--primary:#2c3e50;--muted:#6b7a89;--line:#e5e7eb;--bg:#f3f4f6;--ok:#15803d;--okbg:#dcfce7;--danger:#b91c1c;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#1f2937;font-size:15px}
.hidden{display:none !important}
header{background:var(--dark);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{font-size:18px;margin:0}
header .who{font-size:13px;opacity:.85;display:flex;gap:10px;align-items:center}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
nav button{border:0;background:none;padding:14px 18px;cursor:pointer;color:var(--muted);font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
main{padding:20px;max-width:1000px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.task{cursor:pointer}
.task:hover{border-color:#94a3b8}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters select{padding:9px;border:1px solid #cbd5e1;border-radius:6px;min-width:170px;background:#fff}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px;color:var(--primary)}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;font-family:inherit;background:#fff}
textarea{min-height:80px;resize:vertical}
button{font-family:inherit}
.primary{background:var(--primary);color:#fff;border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap}
.primary:disabled{opacity:.6;cursor:wait}
.danger{background:var(--danger);color:#fff;border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:14px}
.ghost{background:#e5e7eb;color:#1f2937;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.ghost:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;background:#fef3c7;color:#92400e;white-space:nowrap}
.badge.completada{background:#dcfce7;color:#166534}
.badge.en-progreso{background:#dbeafe;color:#1e40af}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:24px}
.msg-ok{background:var(--okbg);color:var(--ok);border:1px solid #86efac;padding:12px;border-radius:6px;margin-bottom:14px;font-weight:500}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--okbg);color:var(--ok);border:2px solid var(--ok);padding:14px 24px;border-radius:8px;font-weight:600;z-index:1000;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90%}
.toast.error{background:#fee2e2;color:var(--danger);border-color:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:500}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:10px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.file-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f9fafb;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.file-row a{color:var(--primary);font-weight:600}
.comment{border-left:3px solid var(--primary);background:#f9fafb;padding:8px 10px;margin-bottom:8px;border-radius:4px;font-size:14px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a2332,#2c3e50);padding:16px}
.login-box{background:#fff;padding:28px;border-radius:10px;width:100%;max-width:360px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <form class="login-box" onsubmit="login(event)">
    <h2 style="margin:0 0 6px;color:#1a2332">Control de Mantenimiento</h2>
    <label>Usuario</label>
    <input id="loginUser" autocomplete="username" required>
    <label>Contraseña</label>
    <input id="loginPass" type="password" autocomplete="current-password" required>
    <button class="primary" style="width:100%;margin-top:18px" type="submit">Entrar</button>
    <p id="loginErr" style="color:var(--danger);font-size:13px;min-height:18px"></p>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <h1>📋 Control de Mantenimiento</h1>
    <div class="who"><span id="hUser"></span><button class="ghost" onclick="logout()">Salir</button></div>
  </header>
  <nav id="nav"></nav>
  <main>

    <!-- DASHBOARD -->
    <section id="tab-dashboard" class="tab">
      <div class="filters">
        <select id="dashEdificio" onchange="renderTasks('dash')"></select>
        <select id="dashSupervisor" onchange="renderTasks('dash')"></select>
        <select id="dashEstado" onchange="renderTasks('dash')">
          <option value="">Todos los estados</option>
          <option value="pendiente">Pendiente</option>
          <option value="en progreso">En progreso</option>
          <option value="completada">Completada</option>
        </select>
        <select id="dashSort" onchange="renderTasks('dash')">
          <option value="edificio">Ordenar: Edificio A-Z</option>
          <option value="supervisor">Ordenar: Supervisor A-Z</option>
          <option value="titulo">Ordenar: Título A-Z</option>
          <option value="fecha">Ordenar: Fecha límite</option>
        </select>
      </div>
      <div id="dashList"></div>
    </section>

    <!-- MIS TAREAS -->
    <section id="tab-mis" class="tab hidden">
      <div class="filters">
        <select id="misEdificio" onchange="renderTasks('mis')"></select>
        <select id="misEstado" onchange="renderTasks('mis')">
          <option value="">Todos los estados</option>
          <option value="pendiente">Pendiente</option>
          <option value="en progreso">En progreso</option>
          <option value="completada">Completada</option>
        </select>
        <select id="misSort" onchange="renderTasks('mis')">
          <option value="edificio">Ordenar: Edificio A-Z</option>
          <option value="titulo">Ordenar: Título A-Z</option>
          <option value="fecha">Ordenar: Fecha límite</option>
        </select>
      </div>
      <div id="misList"></div>
    </section>

    <!-- CREAR TAREA -->
    <section id="tab-crear" class="tab hidden">
      <div id="cMsg" class="msg-ok hidden"></div>
      <div class="card">
        <form id="createTaskForm" onsubmit="crearTarea(event)">
          <label>Condominio</label>
          <select id="cEdificio" required></select>
          <label>Supervisor</label>
          <select id="cSupervisor" required></select>
          <label>Título</label>
          <input id="cTitulo" required>
          <label>Descripción</label>
          <textarea id="cDescripcion" required></textarea>
          <label>Tipo</label>
          <select id="cTipo">
            <option>mantenimiento</option>
            <option>reparación</option>
            <option>limpieza</option>
            <option>administrativo</option>
            <option>otro</option>
          </select>
          <label>Prioridad</label>
          <select id="cPrioridad">
            <option>baja</option>
            <option selected>media</option>
            <option>alta</option>
            <option>urgente</option>
          </select>
          <label>Fecha límite</label>
          <input id="cFecha" type="date">
          <label>Archivos (cualquier tipo, máx. 5 MB c/u)</label>
          <input id="cArchivos" type="file" multiple onchange="previewCrear()">
          <div id="cPreview" class="meta"></div>
          <button id="cBtn" class="primary" type="submit" style="width:100%;margin-top:18px">Registrar tarea</button>
        </form>
      </div>
    </section>

    <!-- REPORTES -->
    <section id="tab-reportes" class="tab hidden"><div id="repBox"></div></section>

    <!-- SUPERVISORES -->
    <section id="tab-supervisores" class="tab hidden"><div id="supBox"></div></section>

  </main>
</div>

<!-- MODAL TAREA -->
<div id="taskModal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div id="modalBody"></div>
    <div style="text-align:right;margin-top:14px"><button class="ghost" onclick="closeModal()">Cerrar</button></div>
  </div>
</div>

<script>
const SB_URL = 'https://wjoylbxrwmgxkwberjwq.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indqb3lsYnhyd21neGt3YmVyandxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTMxODMsImV4cCI6MjEwNjE4OTE4M30.WFsKG8lXAneCXeSyB8Q17elExGuh-XeR1o3UXwbKy9E';
const MAX_BYTES = 5 * 1024 * 1024;

const CONDOMINIOS = [
  'Ahuehuetes 737','Ahuehuetes 869','Emerson 121','Homero 1431','Horacio 1528','Ibsen 42',
  'Masaryk 284','Moliere 340 A','Moliere 340 B','Moliere 51','Petrarca 326','Sócrates 113',
  'Sócrates 228','Sócrates 347','Sudermann 315','Tamarindos 246','Tennyson 147',
  'Alejandro Dumas 128','Alfredo Musset 24','Anatole France 341','Alejandro Dumas 29',
  'Edgar Allan Poe','Galileo 110','Galileo 245','Galileo 330','Goldsmith 306','Homero 1205 Deptos',
  'Lamartine 122','Lamartine 230','Residencial A. France 245','Ruben Dario 57 AC','Schiller 421',
  'Temistocles 236','Alto Domani','Antonio León 43','Atardecer 5','Diego de Osorio 120','Etra 2',
  'Mtz de Castro 12','Puerta de Jurica','Rio Atoyac 65','Rio Ebro 83','Rio Nilo','Rosedal',
  'Tornel 9','Arquímedes 221','Camelia 114','Culiacán 101','Dickens 30','Millet 22','Pachuca 2',
  'Rébsamen 342','Shakespeare 44','Sierra Nevada 475','Tennyson 159','SV1125'
];

const TABS = [
  { id: 'dashboard', label: 'Dashboard', roles: null },
  { id: 'mis', label: 'Mis Tareas', roles: ['supervisor', 'ejecutiva'] },
  { id: 'crear', label: 'Crear Tarea', roles: null },
  { id: 'reportes', label: 'Reportes', roles: ['admin'] },
  { id: 'supervisores', label: 'Supervisores', roles: ['admin'] }
];

let currentUser = null;
let allUsers = [];
let allTasks = [];
let selectedId = null;

// ---------- Supabase ----------
async function sb(path, method = 'GET', body) {
  const headers = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  if (method !== 'GET') headers['Prefer'] = 'return=representation';
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    method, headers, body: body !== undefined ? JSON.stringify(body) : undefined
  });
  const text = await res.text();
  if (!res.ok) throw new Error(text || ('HTTP ' + res.status));
  return text ? JSON.parse(text) : [];
}

// ---------- Utilidades ----------
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function cmpStr(a, b) {
  return String(a || '').localeCompare(String(b || ''), 'es', { numeric: true, sensitivity: 'base' });
}
function val(id) {
  const el = document.getElementById(id);
  return el ? el.value : '';
}
function toArray(v) {
  if (Array.isArray(v)) return v;
  if (typeof v === 'string') {
    try { const j = JSON.parse(v); if (Array.isArray(j)) return j; } catch (e) {}
    return v.replace(/^\{|\}$/g, '').split(',').map(s => s.trim().replace(/^"|"$/g, '')).filter(Boolean);
  }
  return [];
}
function parseArchivos(s) {
  if (Array.isArray(s)) return s;
  try { const j = JSON.parse(s || '[]'); return Array.isArray(j) ? j : []; } catch (e) { return []; }
}
function fmtFecha(d) {
  if (!d) return '—';
  const dt = new Date(String(d).length === 10 ? d + 'T00:00:00' : d);
  return isNaN(dt) ? d : dt.toLocaleDateString('es-MX');
}
function fmtFechaHora(d) {
  if (!d) return '';
  const dt = new Date(d);
  return isNaN(dt) ? String(d) : dt.toLocaleString('es-MX');
}
function nombreUser(id, def = 'Usuario') {
  const u = allUsers.find(x => x.id === Number(id));
  return u ? u.nombre : def;
}
function nombreSup(id) {
  return nombreUser(id, 'Sin asignar');
}
function leerArchivo(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve({ nombre: file.name, tipo: file.type, tamano: file.size, datos: r.result });
    r.onerror = () => reject(new Error('No se pudo leer ' + file.name));
    r.readAsDataURL(file);
  });
}
function showToast(msg, type = '') {
  const d = document.createElement('div');
  d.className = 'toast' + (type === 'error' ? ' error' : '');
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3500);
}
function normUser(u) {
  return { id: Number(u.id), username: u.username, nombre: u.nombre || u.username, role: u.role, edificios: toArray(u.edificios) };
}

// ---------- Permisos ----------
function puedeVerTodo() { return ['admin', 'jefe'].includes(currentUser.role); }
function esMia(t) { return Number(t.supervisor_id) === currentUser.id; }
function puedeCambiarEstado(t) { return puedeVerTodo() || esMia(t); }
function puedeEliminar() { return currentUser.role === 'admin'; }

// ---------- Sesión ----------
async function login(e) {
  e.preventDefault();
  const err = document.getElementById('loginErr');
  err.textContent = '';
  const u = val('loginUser').trim();
  const p = val('loginPass');
  try {
    const r = await sb(`users?select=*&username=eq.${encodeURIComponent(u)}&password=eq.${encodeURIComponent(p)}`);
    if (!r.length) { err.textContent = 'Usuario o contraseña incorrectos'; return; }
    currentUser = normUser(r[0]);
    localStorage.setItem('mant_user', JSON.stringify(currentUser));
    startApp();
  } catch (ex) {
    err.textContent = 'Error de conexión: ' + ex.message;
  }
}
function logout() {
  localStorage.removeItem('mant_user');
  location.reload();
}
function startApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('hUser').textContent = currentUser.nombre + ' · ' + currentUser.role;
  document.getElementById('nav').innerHTML = TABS
    .filter(t => !t.roles || t.roles.includes(currentUser.role))
    .map(t => `<button data-tab="${t.id}" onclick="showTab('${t.id}')">${t.label}</button>`)
    .join('');
  showTab('dashboard');
  loadAll();
}
function showTab(id) {
  document.querySelectorAll('.tab').forEach(s => s.classList.add('hidden'));
  document.getElementById('tab-' + id).classList.remove('hidden');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  if (id === 'dashboard') renderTasks('dash');
  if (id === 'mis') renderTasks('mis');
  if (id === 'reportes') renderReportes();
  if (id === 'supervisores') renderSupervisores();
  if (id === 'crear') document.getElementById('cMsg').classList.add('hidden');
}

// ---------- Carga de datos ----------
async function loadAll() {
  try {
    const [tasks, users] = await Promise.all([
      sb('tasks?select=*&order=id.desc'),
      sb('users?select=*')
    ]);
    allTasks = tasks;
    allUsers = users.map(normUser);
  } catch (err) {
    showToast('No se pudieron cargar los datos: ' + err.message, 'error');
    return;
  }
  populateFilters();
  renderTasks('dash');
  renderTasks('mis');
  const active = document.querySelector('nav button.active');
  const tab = active ? active.dataset.tab : '';
  if (tab === 'reportes') renderReportes();
  if (tab === 'supervisores') renderSupervisores();
  refreshModal();
}

function fillSelect(id, items, first) {
  const el = document.getElementById(id);
  if (!el) return;
  const prev = el.value;
  const opts = items.map(i => Array.isArray(i) ? i : [i, i]);
  el.innerHTML = `<option value="">${esc(first)}</option>` +
    opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  if ([...el.options].some(o => o.value === prev)) el.value = prev;
}

function populateFilters() {
  const edificios = [...new Set([...CONDOMINIOS, ...allTasks.map(t => t.condominio).filter(Boolean)])]
    .sort(cmpStr);
  const sups = allUsers
    .filter(u => ['supervisor', 'ejecutiva'].includes(u.role))
    .sort((a, b) => cmpStr(a.nombre, b.nombre))
    .map(u => [u.id, u.nombre]);

  fillSelect('dashEdificio', edificios, 'Todos los edificios');
  fillSelect('misEdificio', edificios, 'Todos los edificios');
  fillSelect('dashSupervisor', sups, 'Todos los supervisores');
  fillSelect('cEdificio', edificios, 'Selecciona condominio');
  fillSelect('cSupervisor', sups, 'Selecciona supervisor');
}

// ---------- Lista de tareas ----------
function renderTasks(prefix) {
  if (!currentUser) return;
  const box = document.getElementById(prefix + 'List');
  if (!box) return;

  const base = (prefix === 'dash' && puedeVerTodo()) ? allTasks : allTasks.filter(esMia);
  const ed = val(prefix + 'Edificio');
  const sup = val(prefix + 'Supervisor');
  const est = val(prefix + 'Estado');
  const orden = val(prefix + 'Sort') || 'edificio';

  const list = base.filter(t =>
    (!ed || t.condominio === ed) &&
    (!sup || String(t.supervisor_id) === sup) &&
    (!est || (t.estado || 'pendiente') === est)
  );

  const comparadores = {
    edificio: (a, b) => cmpStr(a.condominio, b.condominio) || cmpStr(a.titulo, b.titulo),
    supervisor: (a, b) => cmpStr(nombreSup(a.supervisor_id), nombreSup(b.supervisor_id)) || cmpStr(a.condominio, b.condominio),
    titulo: (a, b) => cmpStr(a.titulo, b.titulo),
    fecha: (a, b) => cmpStr(a.fecha_limite || '9999', b.fecha_limite || '9999')
  };
  list.sort(comparadores[orden] || comparadores.edificio);

  box.innerHTML = list.length
    ? `<p class="meta">${list.length} tarea(s)</p>` + list.map(cardHTML).join('')
    : '<div class="empty">No hay tareas con esos filtros</div>';
}

function cardHTML(t) {
  const est = t.estado || 'pendiente';
  const cls = est.replace(/\s+/g, '-');
  return `
    <div class="card task" onclick="openTask(${t.id})">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <strong>${esc(t.titulo)}</strong>
        <span class="badge ${esc(cls)}">${esc(est)}</span>
      </div>
      <div class="meta">${esc(t.condominio)} · Supervisor: ${esc(nombreSup(t.supervisor_id))}</div>
      <div class="meta">Prioridad: ${esc(t.prioridad || '—')} · Tipo: ${esc(t.tipo || '—')} · Límite: ${fmtFecha(t.fecha_limite)} · Archivos: ${parseArchivos(t.archivos).length}</div>
    </div>`;
}

// ---------- Crear tarea ----------
function previewCrear() {
  const files = document.getElementById('cArchivos').files;
  document.getElementById('cPreview').innerHTML = [...files].map(f =>
    `📎 ${esc(f.name)} (${(f.size / 1024).toFixed(0)} KB)${f.size > MAX_BYTES ? ' ⚠ pasa de 5 MB' : ''}`
  ).join('<br>');
}

async function crearTarea(e) {
  e.preventDefault();
  const btn = document.getElementById('cBtn');
  const edificio = val('cEdificio');
  const sup = val('cSupervisor');
  const titulo = val('cTitulo').trim();
  const desc = val('cDescripcion').trim();

  if (!edificio) return showToast('Selecciona el condominio', 'error');
  if (!sup) return showToast('Selecciona el supervisor', 'error');
  if (!titulo || !desc) return showToast('Título y descripción son obligatorios', 'error');

  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    const archivos = [];
    for (const f of document.getElementById('cArchivos').files) {
      if (f.size > MAX_BYTES) throw new Error(f.name + ' pasa de 5 MB');
      archivos.push(await leerArchivo(f));
    }
    const payload = {
      condominio: edificio,
      supervisor_id: Number(sup),
      titulo,
      descripcion: desc,
      tipo: val('cTipo'),
      prioridad: val('cPrioridad'),
      estado: 'pendiente',
      fecha_limite: val('cFecha') || null,
      fecha_creacion: new Date().toISOString().slice(0, 10),
      notas: '',
      foto: '',
      archivos: JSON.stringify(archivos)
    };
    const r = await sb('tasks', 'POST', payload);
    if (!r.length) throw new Error('Supabase no confirmó el guardado');

    e.target.reset();
    document.getElementById('cPreview').innerHTML = '';
    const msg = document.getElementById('cMsg');
    msg.innerHTML = `✓ Tarea registrada: <strong>${esc(titulo)}</strong> (${esc(edificio)}). El formulario quedó limpio para la siguiente.`;
    msg.classList.remove('hidden');
    showToast('✓ Tarea registrada');
    await loadAll();
    setTimeout(() => showTab('dashboard'), 1200);
  } catch (err) {
    showToast('No se pudo registrar: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Registrar tarea';
  }
}

// ---------- Modal de tarea ----------
function openTask(id) {
  selectedId = id;
  const t = allTasks.find(x => x.id === id);
  if (!t) return;
  const puede = puedeCambiarEstado(t);
  const estados = ['pendiente', 'en progreso', 'completada'];
  const actual = t.estado || 'pendiente';

  let archivosHTML = '';
  if (t.foto) {
    archivosHTML += `<div class="file-row"><span>📷 Foto anterior</span><a href="${t.foto}" download="foto.jpg">Descargar</a></div>`;
  }
  parseArchivos(t.archivos).forEach(a => {
    archivosHTML += `<div class="file-row"><span>📄 ${esc(a.nombre)}</span><a href="${a.datos}" download="${esc(a.nombre)}">Descargar</a></div>`;
  });
  if (!archivosHTML) archivosHTML = '<div class="meta">Sin archivos</div>';

  document.getElementById('modalBody').innerHTML = `
    <h3 style="margin:0 0 6px">${esc(t.titulo)}</h3>
    <div class="meta">${esc(t.condominio)} · Supervisor: ${esc(nombreSup(t.supervisor_id))}</div>
    <div class="meta">Tipo: ${esc(t.tipo || '—')} · Prioridad: ${esc(t.prioridad || '—')} · Límite: ${fmtFecha(t.fecha_limite)} · Creada: ${fmtFecha(t.fecha_creacion)}</div>
    <p style="white-space:pre-wrap">${esc(t.descripcion || '')}</p>

    <label>Estado</label>
    <div style="display:flex;gap:8px">
      <select id="mEstado" style="flex:1" ${puede ? '' : 'disabled'}>
        ${estados.map(e => `<option ${e === actual ? 'selected' : ''}>${e}</option>`).join('')}
      </select>
      <button class="primary" onclick="cambiarEstado()" ${puede ? '' : 'disabled'}>Guardar</button>
    </div>
    ${puede ? '' : '<div class="meta">Solo puedes cambiar el estado de tus tareas.</div>'}

    <label>Archivos adjuntos</label>
    ${archivosHTML}
    <div style="display:flex;gap:8px;margin-top:8px">
      <input type="file" id="mFile" multiple>
      <button class="ghost" onclick="subirArchivos()">Subir</button>
    </div>

    <label>Comentarios</label>
    <div id="mComentarios"><div class="meta">Cargando...</div></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <textarea id="mComentario" placeholder="Escribe un comentario..." style="min-height:50px"></textarea>
      <button class="primary" id="mEnviarBtn" onclick="enviarComentario()">Enviar</button>
    </div>

    ${puedeEliminar() ? '<button class="danger" style="width:100%;margin-top:18px" onclick="eliminarTarea()">Eliminar tarea</button>' : ''}
  `;
  document.getElementById('taskModal').classList.add('open');
  loadComments(id);
}

function closeModal() {
  document.getElementById('taskModal').classList.remove('open');
  selectedId = null;
}
function refreshModal() {
  if (selectedId !== null && document.getElementById('taskModal').classList.contains('open')) {
    openTask(selectedId);
  }
}

async function run(fn, okMsg) {
  try {
    await fn();
    if (okMsg) showToast(okMsg);
  } catch (e) {
    showToast('Error: ' + e.message, 'error');
  }
  await loadAll();
}

async function cambiarEstado() {
  const t = allTasks.find(x => x.id === selectedId);
  if (!t || !puedeCambiarEstado(t)) return;
  const nuevo = val('mEstado');
  await run(() => sb(`tasks?id=eq.${t.id}`, 'PATCH', { estado: nuevo }), '✓ Estado actualizado');
}

async function subirArchivos() {
  const input = document.getElementById('mFile');
  if (!input.files.length) return showToast('Selecciona al menos un archivo', 'error');
  const t = allTasks.find(x => x.id === selectedId);
  if (!t) return;
  await run(async () => {
    const nuevos = [];
    for (const f of input.files) {
      if (f.size > MAX_BYTES) throw new Error(f.name + ' pasa de 5 MB');
      nuevos.push(await leerArchivo(f));
    }
    const arr = parseArchivos(t.archivos).concat(nuevos);
    await sb(`tasks?id=eq.${t.id}`, 'PATCH', { archivos: JSON.stringify(arr) });
  }, '✓ Archivo(s) subido(s)');
}

async function eliminarTarea() {
  if (!puedeEliminar()) return;
  if (!confirm('¿Eliminar esta tarea y sus comentarios?')) return;
  const id = selectedId;
  await run(async () => {
    await sb(`comments?task_id=eq.${id}`, 'DELETE');
    await sb(`tasks?id=eq.${id}`, 'DELETE');
    closeModal();
  }, '✓ Tarea eliminada');
}

// ---------- Comentarios ----------
async function loadComments(id) {
  const box = document.getElementById('mComentarios');
  if (!box) return;
  try {
    const list = await sb(`comments?select=*&task_id=eq.${id}&order=id.asc`);
    if (selectedId !== id) return;
    box.innerHTML = list.length
      ? list.map(c => `
          <div class="comment">
            <strong>${esc(nombreUser(c.user_id))}</strong>
            <span class="meta">${esc(fmtFechaHora(c.fecha || c.created_at))}</span>
            <div>${esc(c.texto)}</div>
          </div>`).join('')
      : '<div class="meta">Sin comentarios todavía</div>';
  } catch (e) {
    box.innerHTML = `<div class="meta" style="color:var(--danger)">No se pudieron cargar: ${esc(e.message)}</div>`;
  }
}

async function enviarComentario() {
  const texto = val('mComentario').trim();
  if (!texto) return showToast('Escribe un comentario', 'error');
  const btn = document.getElementById('mEnviarBtn');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    const r = await sb('comments', 'POST', {
      task_id: Number(selectedId),
      user_id: currentUser.id,
      texto,
      fecha: new Date().toISOString()
    });
    if (!r.length) throw new Error('Supabase no confirmó el guardado');
    document.getElementById('mComentario').value = '';
    showToast('✓ Comentario enviado');
    await loadComments(selectedId);
  } catch (e) {
    showToast('No se pudo enviar el comentario: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar';
  }
}

// ---------- Reportes ----------
function renderReportes() {
  const porEstado = { 'pendiente': 0, 'en progreso': 0, 'completada': 0 };
  const porSup = {};
  const porEd = {};
  allTasks.forEach(t => {
    const k = t.estado || 'pendiente';
    porEstado[k] = (porEstado[k] || 0) + 1;
    const s = nombreSup(t.supervisor_id);
    porSup[s] = (porSup[s] || 0) + 1;
    const c = t.condominio || 'Sin condominio';
    porEd[c] = (porEd[c] || 0) + 1;
  });
  const filas = obj => Object.keys(obj).sort(cmpStr)
    .map(k => `<div class="meta">${esc(k)}: ${obj[k]}</div>`).join('');
  document.getElementById('repBox').innerHTML = `
    <div class="card"><strong>Total de tareas: ${allTasks.length}</strong></div>
    <div class="card"><strong>Por estado</strong>${filas(porEstado)}</div>
    <div class="card"><strong>Por supervisor (A-Z)</strong>${filas(porSup)}</div>
    <div class="card"><strong>Por condominio (A-Z)</strong>${filas(porEd)}</div>`;
}

// ---------- Supervisores ----------
function renderSupervisores() {
  const lista = allUsers
    .filter(u => u.role !== 'admin')
    .sort((a, b) => cmpStr(a.nombre, b.nombre));
  document.getElementById('supBox').innerHTML = lista.map(u => {
    const edif = [...u.edificios].sort(cmpStr);
    const n = allTasks.filter(t => Number(t.supervisor_id) === u.id).length;
    return `
      <div class="card">
        <strong>${esc(u.nombre)}</strong>
        <div class="meta">Usuario: ${esc(u.username)} · Rol: ${esc(u.role)} · Tareas: ${n}</div>
        <div class="meta">Condominios (${edif.length}): ${edif.length ? esc(edif.join(', ')) : 'Sin edificios asignados'}</div>
      </div>`;
  }).join('') || '<div class="empty">No hay usuarios</div>';
}

// ---------- Inicio ----------
window.addEventListener('DOMContentLoaded', () => {
  const guardado = localStorage.getItem('mant_user');
  if (guardado) {
    try { currentUser = JSON.parse(guardado); startApp(); return; } catch (e) {}
  }
});
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}
</script>
